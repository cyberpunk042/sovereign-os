# sovereign-os science-tools catalog — non-LLM, domain-specific compute tools.
#
# Materialises the operator's "scientific / merge / specialist catalog" (Image 2
# of the handwritten verbatim note
# `raw/notes/2026-07-02-operator-model-routing-catalog-handwritten-verbatim.md`
# in the info-hub wiki, encoded there as the `dna` / `protein` / `particles`
# routing profiles in `config/model-catalog/{models.yaml,profiles.yaml}`).
#
# These tools are deliberately NOT in models/catalog.yaml — they are libraries
# or code+weights tools, not Trinity-tier LLMs. They occupy the EXISTING
# `simulation` REPL kind declared in config/execution/m023-execution-substrate.yaml
# (M00374, Tiers 3-5), so this catalog materialises an existing execution kind.
#
# status: integrated = install + runner + panel shipped here (NVIDIA Warp is the
#         first); cataloged = declared for future integration (data only).
#
# Schema: schemas/science-tools.schema.yaml  (validated by
#         tests/schema/test_science_tools_schema_conformance.py)

schema_version: "1.0.0"

catalog:
  version: "1.0.0"
  description: |
    Science / domain compute tools by scientific domain — DNA / genomics,
    protein folding, and particle / physics simulation. NVIDIA Warp is the
    first integrated tool; the rest are cataloged for future rounds.

  tools:
    # ── particles / physics simulation ──────────────────────────────────
    - id: warp-lang
      name: "Warp-Lang (NVIDIA)"
      domain: particles
      kind: python-cuda-library
      install: {method: pip, ref: warp-lang}
      tiers: [cpu, rtx-4090, rtx-pro]
      cpu_capable: true
      status: integrated
      source: "https://github.com/NVIDIA/warp"
      license: "Apache-2.0"
      run_cmd: "sovereign-osctl science run"
      docs: "https://github.com/NVIDIA/warp"
      detect: {method: import, ref: warp}
      notes: |
        NVIDIA Warp — a Python framework for high-performance / differentiable
        simulation (warp.sim: particles / cloth / rigid-body). NOT an LLM. The
        pip wheel bundles the CUDA 12 runtime, so GPU works with just the NVIDIA
        driver; runs on CPU when no CUDA GPU is present. On SAIN-01 the host
        targets the RTX PRO 6000 (cuda:0). The RTX 4090 is the OcuLink eGPU
        (host-resident by default; VFIO-isolated only when opted in, SDD-993).
        SDD-301: the panel executes the sample sim through the exec-rail
        (control `science-sim`) and keeps a bounded run history
        (~/.local/state/sovereign-os/science-runs.jsonl).

    # ── DNA / genomics ──────────────────────────────────────────────────
    - id: evo-arc-institute
      name: "Evo (Arc Institute)"
      domain: dna
      kind: hf-model
      install: {method: hf, ref: "arcinstitute/evo2_7b"}
      tiers: [rtx-4090]
      cpu_capable: false
      status: cataloged
      source: "https://huggingface.co/arcinstitute/evo2_7b"
      license: "Apache-2.0"
      size_gb: 13.77
      docs: "https://github.com/ArcInstitute/evo2"
      detect: {method: hf, ref: "arcinstitute/evo2_7b"}
      notes: |
        Evo 2 (arcinstitute/evo2_7b) — autoregressive DNA language model trained
        on trillions of DNA tokens, up to 1M sequence length (7B params, 32
        layers; a 40B sibling exists). Weights on HF (13.77 GB, verified
        2026-10-02); code at github.com/ArcInstitute/evo2. Alternative:
        HyenaDNA.

    - id: hyenadna
      name: "HyenaDNA"
      domain: dna
      kind: hf-model
      install: {method: hf, ref: "LongSafari/hyenadna-medium-450k-seqlen-hf"}
      tiers: [rtx-4090]
      cpu_capable: false
      status: cataloged
      source: "https://huggingface.co/LongSafari/hyenadna-medium-450k-seqlen-hf"
      size_gb: 0.11
      vram_gb: 16
      docs: "https://github.com/HazyResearch/hyena-dna"
      detect: {method: hf, ref: "LongSafari/hyenadna-medium-450k-seqlen-hf"}
      notes: |
        Long-range genomics foundation model (HazyResearch), context up to 1M
        tokens at single-nucleotide resolution. The medium-450k checkpoint is
        small in weight (112.65 MB, verified 2026-10-02 — the long context
        comes from the Hyena operator, not parameter count); the HF page's
        suggested minimum for INFERENCE is a T4 (16 GB VRAM), fine-tune wants
        an A100-40GB. Lighter alternative to Evo.

    - id: rosettafold-all-atom
      name: "RoseTTAFold All-Atom (RFAA)"
      domain: dna
      kind: code-weights
      install: {method: github, ref: "https://github.com/baker-laboratory/RoseTTAFold-All-Atom"}
      tiers: [rtx-pro]
      cpu_capable: false
      status: cataloged
      source: "https://github.com/baker-laboratory/RoseTTAFold-All-Atom"
      size_gb: 1.34
      docs: "https://github.com/baker-laboratory/RoseTTAFold-All-Atom"
      detect: {method: checkout, ref: "/opt/RoseTTAFold-All-Atom"}
      notes: |
        Baker Lab all-atom structure prediction. GitHub-distributed — NOT an HF
        model repo (2026-07-02). Weights RFAA_paper_weights.pt = 1.34 GB
        (verified 2026-10-02), but the official README also requires the MSA
        databases UniRef30 (46 GB) + BFD (272 GB) — a ~320 GB working set —
        plus a conda environment and a licensed SignalP-6.0. Heaviest rung;
        rtx-pro tier reflects that.

    # ── protein folding ─────────────────────────────────────────────────
    - id: esmfold
      name: "ESMFold"
      domain: protein
      kind: hf-model
      install: {method: hf, ref: "facebook/esmfold_v1"}
      tiers: [rtx-4090]
      cpu_capable: false
      status: cataloged
      source: "https://huggingface.co/facebook/esmfold_v1"
      size_gb: 8.44
      docs: "https://github.com/facebookresearch/esm"
      detect: {method: hf, ref: "facebook/esmfold_v1", import_module: esm}
      notes: |
        Fast single-sequence protein folding; cheapest rung. Weights on HF
        (8.44 GB, verified 2026-10-02); inference code is the ESM suite
        (`pip install esm`, facebookresearch/esm). No MSA / database lookup
        required — the fastest folding path on the box. Verified on HF
        2026-07-02.

    - id: openfold
      name: "OpenFold"
      domain: protein
      kind: code-weights
      install: {method: github, ref: "https://github.com/aqlaboratory/openfold"}
      tiers: [rtx-4090]
      cpu_capable: false
      status: cataloged
      source: "https://github.com/aqlaboratory/openfold"
      license: "Apache-2.0"
      docs: "https://openfold.readthedocs.io"
      detect: {method: checkout, ref: "/opt/openfold"}
      notes: |
        AQ Laboratory PyTorch reproduction of AlphaFold2 (trainable, unlike the
        original JAX code). GitHub-distributed — NOT an HF model repo
        (2026-07-02). The install script downloads DeepMind's pretrained
        parameters (CC BY 4.0) into openfold/resources/params. Docs live at
        openfold.readthedocs.io.

    - id: alphafold3
      name: "AlphaFold3"
      domain: protein
      kind: code-weights
      install: {method: github, ref: "https://github.com/google-deepmind/alphafold3"}
      tiers: [rtx-pro, rtx-4090]
      cpu_capable: false
      status: cataloged
      source: "https://github.com/google-deepmind/alphafold3"
      size_gb: 1.02
      docs: "https://github.com/google-deepmind/alphafold3"
      detect: {method: checkout, ref: "/opt/alphafold3"}
      notes: |
        DeepMind — highest-accuracy rung. Inference pipeline code on GitHub;
        model parameters are gated by Google's terms of use and downloaded
        from storage.googleapis.com/alphafold3/af3.bin.zst (1.02 GB compressed,
        verified 2026-10-02) — NOT an HF model repo (2026-07-02). Code+
        parameters are DeepMind-distributed; a non-commercial hosted option is
        alphafoldserver.com.
