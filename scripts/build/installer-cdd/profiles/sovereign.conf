# simple-cdd profile config for the `sovereign` profile.
#
# THIS FILE EXISTS FOR ONE VARIABLE, AND THE REASON IS NON-OBVIOUS.
# It cost seven failed builds on 2026-07-29. Do not "simplify" it back into
# build.sh's environment — that is exactly what does not work.
#
# ── THE BUG ──────────────────────────────────────────────────────────────────
#
# debian-cd decides which archive components may contribute packages in
# tools/which_deb:
#
#     my @components = qw(main);
#     push @components, 'contrib' if $ENV{CONTRIB};
#     if ($ENV{NONFREE}) {
#         push @components, split / /, $ENV{NONFREE_COMPONENTS};
#     }
#
# So without a truthy NONFREE, `non-free-firmware` is dropped and the firmware
# packages are never placed on CD1, no matter what the mirror holds. The build
# runs to completion — 1499 packages laid out, boot code added, base verified
# installable — and only then fails with:
#
#     ERROR: missing required packages from profile sovereign:
#       amd64-microcode firmware-amd-graphics firmware-nvidia-graphics
#       firmware-misc-nonfree intel-microcode
#
# with all five sitting correctly in tmp/mirror/pool/non-free-firmware/.
#
# NONFREE is set by /usr/bin/build-simple-cdd, and it gets it wrong TWICE:
#
#   1. line 119   self.env.set("NONFREE", "")
#      An inherited environment NONFREE=1 is unconditionally CLOBBERED here.
#
#   2. line 144   if component == "non-free": self.env.set("NONFREE", "1")
#      It only ever flips NONFREE on for the LITERAL component `non-free`.
#      `non-free-firmware` — a separate component since Debian 12 — never
#      matches. simple-cdd has not learned about it.
#
# That is a catch-22 for any trixie profile needing firmware but no non-free:
#   * list `non-free` to flip the flag  -> the component mirrors EMPTY (nothing
#     in this profile pulls from it), CD1 gets no non-free/Packages.gz, and
#     simple-cdd's dose3 distcheck dies on the missing input file;
#   * omit it -> NONFREE is "" and the firmware is silently never placed.
#
# ── THE ESCAPE ───────────────────────────────────────────────────────────────
#
# Profile .conf files are read at build-simple-cdd line 121-124 — AFTER the
# line-119 clobber, and nothing later resets NONFREE (line 144 only ever sets
# it TO "1"). So a value set here survives to debian-cd.
#
# ── WHY IT MUST NOT ALSO BE IN THE ENVIRONMENT ───────────────────────────────
#
# simple_cdd/env.py:365-367 adopts a conf value only when it DIFFERS from the
# ambient environment:
#
#     for key in new_env.keys() & os.environ.keys():
#         if os.environ[key] == new_env[key]: continue
#
# With `export NONFREE=1` in build.sh, this file's NONFREE=1 compares EQUAL,
# hits `continue`, is never adopted, and the clobbered "" stands. Belt and
# braces actively breaks it here. build.sh must leave both variables unset.

NONFREE=1
NONFREE_COMPONENTS="non-free-firmware"
