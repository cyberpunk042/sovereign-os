# scripts/iac/converge.conf — machine truths + module gates.
#
# The PROFILE (/opt/sovereign-os/profiles/<id>.yaml, provisioning.*) is the
# desired-state spec. This file holds only two kinds of thing the profile
# cannot express:
#
#   1. MACHINE TRUTH — where the physical hardware contradicts the profile.
#      These are documented deviations, not preferences.
#   2. GATES — which heavy/networked modules run by default.
#
# Sourced by converge.sh. Plain shell; keep it declarative.

# ─── module gates ────────────────────────────────────────────────────────────
# Modules that download or build are off by default so a bare `converge.sh` is
# fast, offline-safe, and non-surprising. Turn on deliberately.
IAC_ENABLE_SOURCE_REPO=1      # 15 — clone/refresh the upstream git checkout
IAC_ENABLE_OPERATOR=1         # 10 — operator user + groups
IAC_ENABLE_SYSTEMD=1          # 20 — unit enable/disable/mask state
IAC_ENABLE_GPU=1              # 30 — per-GPU power caps
IAC_ENABLE_BOOT=1             # 40 — GRUB default kernel
IAC_ENABLE_UPS=1              # 50 — NUT / network UPS
IAC_ENABLE_OPEN_COMPUTER=1    # 60 — QEMU sandbox provision (~3GB download)
IAC_ENABLE_MODEL=1            # 70 — local model fetch
IAC_ENABLE_BINARIES=1         # 80 — install executables the .deb did not carry

# Tier 2 of module 80: the Rust binaries (sovereign-gatewayd, sovereign-telemetry,
# sovereign-resource-control). Needs rustup with the pinned 1.89.0 toolchain
# (rust-toolchain.toml — Ubuntu's apt rust is older) and a long release build,
# so it is opt-in. guardian-core is a Python script and installs regardless.
#
# Once these are built, module 20 promotes sovereign-gatewayd.service and
# sovereign-telemetry-textfile.timer from held-down to enabled automatically.
IAC_ENABLE_RUST_BINS=1
IAC_BIN_PREFIX=/usr/local

# ─── machine truth: GPU power floor ──────────────────────────────────────────
# profiles/sain-01.yaml declares tdp_watts: 350 for the RTX 5090, and
# gpu-policy.toml declares safe_limit_watts = 350. Both were written against
# the 575 W Founders Edition spec.
#
# The card actually installed is an ASUS TUF-RTX5090-O32G-GAMING OC, which
# reports:
#     power.default_limit = 600 W      power.min_limit = 400 W
# nvidia-smi REJECTS any -pl below 400. 350 is unreachable on this silicon, so
# the boot hook would fail every boot and gpu-watch would flag a permanent
# deviance against a target that can never be met.
#
# 400 W is the hardware floor and the closest achievable clamp (-33% from 600).
# Verified 2026-07-30 via: nvidia-smi --query-gpu=power.min_limit --format=csv
#
# Format: "<pci-device-id>:<watts>". Matched against nvidia-smi pci.device_id,
# which is how nvidia-power-limit.sh assigns caps (enumeration-order safe).
IAC_GPU_CAPS="2bb4:300 2b85:400"

# ─── machine truth: the model this runtime can actually serve ────────────────
# profiles.provisioning.model asks for
#   nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-BF16 → /mnt/vault/models/...
# and today's gateway cannot serve it. Three blockers, verified 2026-07-30:
#
#   1. /mnt/vault does not exist. Both NVMe devices are fully partitioned
#      (Ubuntu on nvme0n1, Debian 13 on nvme1n1), so the vault would need the
#      Debian disk reclaimed or new hardware.
#   2. A 30B BF16 checkpoint is SHARDED. Nothing in crates/ reads a
#      model.safetensors.index.json, and fetch-model.sh pulls exactly three
#      files — config.json, tokenizer.json, model.safetensors. Single-file only.
#   3. sovereign-gatewayd generates on CPU. Nothing in its dependency tree links
#      CUDA. A 30B BF16 forward pass on CPU is not interactive at any RAM size.
#
# So point at the model the loader supports, in the directory the gateway unit
# already reads (SOVEREIGN_GATEWAY_MODEL). SmolLM-135M is the loader's reference
# architecture per fetch-model.sh: Llama-shape, RoPE 10000, GQA, tied
# embeddings, SwiGLU/RMSNorm, single-file safetensors, CPU-sized.
#
# CLEAR THESE TWO to follow the profile verbatim once the loader grows shard +
# GPU support. Module 70 says loudly whenever it is serving an override.
IAC_MODEL_REPO="HuggingFaceTB/SmolLM-135M"
IAC_MODEL_DIR="/var/lib/sovereign-os/models/smollm-135m"

# ─── machine truth: source checkout location ─────────────────────────────────
# /opt/sovereign-os is a dpkg-deployed PAYLOAD SUBSET (no crates/, docs/,
# Makefile, Cargo.toml), so it is NOT a valid checkout of the upstream repo —
# git would report the entire missing tree as deletions. The real checkout
# lives separately. profiles.provisioning.operator.home_repo names it.
IAC_SOURCE_REMOTE="https://github.com/cyberpunk042/sovereign-os.git"
IAC_SOURCE_REF="main"
# The operator cloned it here 2026-07-30. Left empty it would derive as
# <operator home>/<home_repo> from the profile; the real checkout wins.
# This is also where module 80 builds the binaries the .deb did not carry,
# and it is where THIS iac tree lives (version-controlled, unlike the payload).
IAC_SOURCE_DIR="/home/jfortin/sovereign-os"

# ─── machine truth: UPS ──────────────────────────────────────────────────────
# profiles.provisioning.power declares an apc-modbus UPS at 192.168.1.69.
# It is a NETWORK UPS — it does not appear in lsusb. An earlier triage pass
# masked nut-server/nut-monitor after checking only USB; module 50 reverses
# that and configures NUT properly. Set to 0 to leave NUT alone entirely.
IAC_UPS_CONFIGURE=1

# ─── deployed-payload patches ────────────────────────────────────────────────
# 90 — copy specific committed fixes from the checkout into /opt/sovereign-os,
# because the runtime reads the dpkg payload, not the git tree. See the module
# header for the file list and the commit that fixed each. Set to 0 once a
# package carrying those commits is installed.
IAC_ENABLE_PAYLOAD_PATCHES=1

# The D-xx UPS cockpit panel (sovereign-ups-api, loopback :8128). Enabled by
# module 50 once the NUT driver actually holds its Modbus session. Set to 0 to
# keep the panel off even with a working UPS.
IAC_UPS_PANEL=1

# ─── ZFS 'tank' pool (module 95) — DESTRUCTIVE ───────────────────────────────
# profiles.storage declares a zfs-tiered pool that the installer never built.
# Operator decision 2026-07-31: reclaim the Debian 13 disk as a single-device
# tank (not the declared 2-disk raid0 — that needs a from-scratch rebuild).
#
# The two NVMe are IDENTICAL 2TB Samsung 990 EVO Plus and their serials differ
# only in the tail, so the target is resolved BY SERIAL, never by kernel name
# (nvme0n1/nvme1n1 are not stable across boots):
#     S7U7NU1YA16134D = ROOT DISK, carries /   — must never be touched
#     S7U7NU1YA16121D = Debian 13              — the one to reclaim
#
# IAC_TANK_CONFIRM_WIPE must EQUAL the target serial or module 95 refuses. That
# second key is why enabling the gate alone cannot destroy anything.
# ARMED 2026-07-31, after debian-rescue.sh copied 55G off the target disk to
# /home/jfortin/from-debian (.sovereign-os 32G, the sovereign-os checkout 22G,
# the Firefox profile, Downloads, /root). Inspection found no SSH private keys
# and no uncommitted git work. /mnt/kernel_forge (32G build tree) was
# deliberately NOT copied — the stock kernel makes it redundant.
IAC_ENABLE_TANK=1
IAC_TANK_DEVICE_SERIAL="S7U7NU1YA16121D"
IAC_TANK_CONFIRM_WIPE="S7U7NU1YA16121D"
IAC_TANK_POOL="tank"
IAC_TANK_MOUNTPOINT="/mnt/vault"
