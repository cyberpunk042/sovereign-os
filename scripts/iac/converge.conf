# scripts/iac/converge.conf — machine truths + module gates.
#
# The PROFILE (/opt/sovereign-os/profiles/<id>.yaml, provisioning.*) is the
# desired-state spec. This file holds only two kinds of thing the profile
# cannot express:
#
#   1. MACHINE TRUTH — where the physical hardware contradicts the profile.
#      These are documented deviations, not preferences.
#   2. GATES — which heavy/networked modules run by default.
#
# Sourced by converge.sh. Plain shell; keep it declarative.

# ─── module gates ────────────────────────────────────────────────────────────
# Modules that download or build are off by default so a bare `converge.sh` is
# fast, offline-safe, and non-surprising. Turn on deliberately.
IAC_ENABLE_SOURCE_REPO=1      # 15 — clone/refresh the upstream git checkout
IAC_ENABLE_OPERATOR=1         # 10 — operator user + groups
IAC_ENABLE_SYSTEMD=1          # 20 — unit enable/disable/mask state
IAC_ENABLE_GPU=1              # 30 — per-GPU power caps
IAC_ENABLE_BOOT=1             # 40 — GRUB default kernel
IAC_ENABLE_UPS=1              # 50 — NUT / network UPS
IAC_ENABLE_OPEN_COMPUTER=1    # 60 — QEMU sandbox provision (~3GB download)
IAC_ENABLE_MODEL=1            # 70 — local model fetch
IAC_ENABLE_VLLM=1             # 72 — host-resident vLLM (multi-GB install; see below)
IAC_ENABLE_GPU_ROUTE=1        # 84 — attach the GPU tiers to gatewayd (AFTER 80)
IAC_ENABLE_ORACLE=1           # 76 — gpt-oss-120b on the RTX PRO 6000 (~63 GiB)
IAC_ENABLE_ROUTER=1           # 78 — embedder + reranker on the RTX 4090 eGPU
IAC_ENABLE_BINARIES=1         # 80 — install executables the .deb did not carry
IAC_ENABLE_MODEL_STATE=1      # 86 — publish what the tiers actually serve (AFTER 84)
IAC_ENABLE_RAG_CORPUS=1       # 88 — stage docs/ as the RAG corpus and switch retrieval on

# Tier 2 of module 80: the Rust binaries (sovereign-gatewayd, sovereign-telemetry,
# sovereign-resource-control). Needs rustup with the pinned 1.89.0 toolchain
# (rust-toolchain.toml — Ubuntu's apt rust is older) and a long release build,
# so it is opt-in. guardian-core is a Python script and installs regardless.
#
# Once these are built, module 20 promotes sovereign-gatewayd.service and
# sovereign-telemetry-textfile.timer from held-down to enabled automatically.
IAC_ENABLE_RUST_BINS=1
IAC_BIN_PREFIX=/usr/local

# ─── machine truth: GPU power floor ──────────────────────────────────────────
# profiles/sain-01.yaml declares tdp_watts: 350 for the RTX 5090, and
# gpu-policy.toml declares safe_limit_watts = 350. Both were written against
# the 575 W Founders Edition spec.
#
# The card actually installed is an ASUS TUF-RTX5090-O32G-GAMING OC, which
# reports:
#     power.default_limit = 600 W      power.min_limit = 400 W
# nvidia-smi REJECTS any -pl below 400. 350 is unreachable on this silicon, so
# the boot hook would fail every boot and gpu-watch would flag a permanent
# deviance against a target that can never be met.
#
# 400 W is the hardware floor and the closest achievable clamp (-33% from 600).
# Verified 2026-07-30 via: nvidia-smi --query-gpu=power.min_limit --format=csv
#
# THE eGPU (2684, RTX 4090)
# Added 2026-08-14 when the card was fitted. It was already being capped
# correctly at every boot — sain-01.yaml declares tdp_watts: 350 for it and
# nvidia-power-limit.sh applied it (journal: "OK idx=2 devid=0x268410DE
# watts=350"). What was missing is that CONVERGE never checked. Two of three
# cards were asserted here, so a drift on the third — a profile overwritten by
# apt, exactly the scenario this module's header describes — would have passed a
# full converge silently.
#
# 350 W is the profile's declared value, not a new choice: default_limit is
# 450 W and max is 600 W, but this card hangs off an OcuLink-to-M.2 adapter and
# the enclosure's delivery, not the silicon's ceiling, is what sets the budget.
#
# Format: "<pci-device-id>:<watts>". Matched against nvidia-smi pci.device_id,
# which is how nvidia-power-limit.sh assigns caps (enumeration-order safe).
IAC_GPU_CAPS="2bb4:300 2b85:400 2684:350"

# ─── machine truth: the model this runtime can actually serve ────────────────
# profiles.provisioning.model asks for
#   nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-BF16
# and today's gateway cannot serve it. The storage blocker is now GONE — module
# 95 built tank/models with 1M recordsize for exactly this purpose — but two
# code blockers remain, re-verified 2026-07-31:
#
#   1. SHARDED CHECKPOINTS ARE NOT SUPPORTED. The 30B ships as 17
#      model-0000N-of-00017.safetensors plus an index. sovereign-serve
#      (main.rs:344) picks the FIRST *.safetensors from an unordered read_dir
#      and reads it whole; nothing anywhere parses safetensors.index.json.
#      Fixing it is bounded work: read the index, load each shard, give the
#      loader a multi-buffer view instead of a single &[u8].
#   2. THERE IS NO GPU EXECUTION PATH AT ALL. No cudarc/candle/wgpu/vulkano in
#      any crate's Cargo.toml. sovereign-nvfp4-runtime is a pure-CPU
#      implementation of the NVFP4 numeric format whose `blackwell-cuda` feature
#      is an empty placeholder: "Enable when Blackwell sm_120 CUDA bridge ships
#      (M01283)". So even with shard support, a 30B BF16 would run on CPU at
#      seconds-per-token — the shard work alone buys a model still unusable.
#
# So serve the largest model the loader handles TODAY. SmolLM2-1.7B-Instruct is
# single-file (3.3GB), Llama-shaped, tied embeddings, SiLU, vocab 49152 — and
# INSTRUCTION-TUNED, so unlike a base model it answers rather than
# free-associates. Its rope_theta is 130000; the loader parses that per SDD-950
# ("THE field that unblocks" modern models) rather than hardcoding 10000.
#
# It lives on tank/models — the dataset profiles.storage declares for
# "100GB+ weight files; sequential reads", now that it exists.
#
# CLEAR THESE TWO to follow the profile verbatim once shard loading and a GPU
# path land. Module 70 says loudly whenever it is serving an override.
IAC_MODEL_REPO="HuggingFaceTB/SmolLM2-1.7B-Instruct"
IAC_MODEL_DIR="/mnt/vault/models/smollm2-1.7b-instruct"

# ─── machine truth: source checkout location ─────────────────────────────────
# /opt/sovereign-os is a dpkg-deployed PAYLOAD SUBSET (no crates/, docs/,
# Makefile, Cargo.toml), so it is NOT a valid checkout of the upstream repo —
# git would report the entire missing tree as deletions. The real checkout
# lives separately. profiles.provisioning.operator.home_repo names it.
IAC_SOURCE_REMOTE="https://github.com/cyberpunk042/sovereign-os.git"
IAC_SOURCE_REF="main"
# The operator cloned it here 2026-07-30. Left empty it would derive as
# <operator home>/<home_repo> from the profile; the real checkout wins.
# This is also where module 80 builds the binaries the .deb did not carry,
# and it is where THIS iac tree lives (version-controlled, unlike the payload).
IAC_SOURCE_DIR="/home/jfortin/sovereign-os"

# ─── machine truth: UPS ──────────────────────────────────────────────────────
# profiles.provisioning.power declares an apc-modbus UPS at 192.168.1.69.
# It is a NETWORK UPS — it does not appear in lsusb. An earlier triage pass
# masked nut-server/nut-monitor after checking only USB; module 50 reverses
# that and configures NUT properly. Set to 0 to leave NUT alone entirely.
IAC_UPS_CONFIGURE=1

# ─── deployed-payload patches ────────────────────────────────────────────────
# 90 — copy specific committed fixes from the checkout into /opt/sovereign-os,
# because the runtime reads the dpkg payload, not the git tree. See the module
# header for the file list and the commit that fixed each. Set to 0 once a
# package carrying those commits is installed.
IAC_ENABLE_PAYLOAD_PATCHES=1

# The D-xx UPS cockpit panel (sovereign-ups-api, loopback :8128). Enabled by
# module 50 once the NUT driver actually holds its Modbus session. Set to 0 to
# keep the panel off even with a working UPS.
IAC_UPS_PANEL=1

# ─── ZFS 'tank' pool (module 95) — DESTRUCTIVE ───────────────────────────────
# profiles.storage declares a zfs-tiered pool that the installer never built.
# Operator decision 2026-07-31: reclaim the Debian 13 disk as a single-device
# tank (not the declared 2-disk raid0 — that needs a from-scratch rebuild).
#
# The two NVMe are IDENTICAL 2TB Samsung 990 EVO Plus and their serials differ
# only in the tail, so the target is resolved BY SERIAL, never by kernel name
# (nvme0n1/nvme1n1 are not stable across boots):
#     S7U7NU1YA16134D = ROOT DISK, carries /   — must never be touched
#     S7U7NU1YA16121D = Debian 13              — the one to reclaim
#
# IAC_TANK_CONFIRM_WIPE must EQUAL the target serial or module 95 refuses. That
# second key is why enabling the gate alone cannot destroy anything.
# ARMED 2026-07-31, after debian-rescue.sh copied 55G off the target disk to
# /home/jfortin/from-debian (.sovereign-os 32G, the sovereign-os checkout 22G,
# the Firefox profile, Downloads, /root). Inspection found no SSH private keys
# and no uncommitted git work. /mnt/kernel_forge (32G build tree) was
# deliberately NOT copied — the stock kernel makes it redundant.
# DISARMED again 2026-07-31 once the pool existed. Module 95 takes an idempotent
# fast path while `tank` is imported, so the wipe branch is unreachable today —
# but a live confirm token is a loaded gun: export the pool for any reason and
# the next converge would silently re-wipe the disk. Re-arm deliberately, for
# the one run that needs it, then blank it again.
IAC_ENABLE_TANK=1
IAC_TANK_DEVICE_SERIAL="S7U7NU1YA16121D"
IAC_TANK_CONFIRM_WIPE=""
IAC_TANK_POOL="tank"
IAC_TANK_MOUNTPOINT="/mnt/vault"

# tank/context encryption (module 95). profiles.storage asks for aes-256-gcm.
# Operator decision 2026-07-31: keyfile on the ROOT disk — tank is on nvme1n1
# and the key on nvme0n1, so the pool disk leaving the building yields nothing.
# Encryption cannot be enabled in place, so the dataset is recreated; module 95
# refuses if it holds >10MB unless IAC_TANK_ENCRYPT_CONFIRM="destroy-context".
# BACK UP THE KEYFILE — losing it makes tank/context unrecoverable.
IAC_TANK_ENCRYPT_CONTEXT=1
IAC_TANK_KEYFILE="/etc/zfs/keys/tank-context.key"
IAC_TANK_ENCRYPT_CONFIRM=""

# tank/agents encryption (module 95). profiles.storage asks for aes-256-gcm on
# the runtime cache + sub-agent scratch dataset. Same scheme and same root-disk
# keyfile boundary as tank/context above. agents is scratch, so recreating it to
# enable encryption is cheap; module 95 still refuses if it holds >10MB unless
# IAC_TANK_ENCRYPT_CONFIRM="destroy-agents". BACK UP THE KEYFILE.
IAC_TANK_ENCRYPT_AGENTS=1
IAC_TANK_AGENTS_KEYFILE="/etc/zfs/keys/tank-agents.key"

# ─── rescued Debian archive (module 96) ──────────────────────────────────────
# /home/jfortin/from-debian is the ONLY copy of what was on nvme1n1 before
# module 95 reclaimed it. ~54G of it is the abandoned 6.12.0 kernel-forge tree
# plus regenerable build output; ~1.7G is worth keeping (Firefox profile, the
# MOK Secure Boot keys, build logs, Downloads, /root).
#
# PRUNE IS A SEPARATE KEY on purpose. Module 96 copies and verifies with the
# gate alone; it only deletes the source when PRUNE is also set, and only after
# every keeper is confirmed byte-identical at the destination. Copy, verify,
# then delete — never a "move" that can half-succeed on a sole copy.
IAC_ENABLE_ARCHIVE=1
IAC_ENABLE_ARCHIVE_PRUNE=1

# ── 72 — host-resident vLLM for the GPU inference tier ──────────────────────
# This box ships sovereign-logic-engine / sovereign-oracle-core / sovereign-router
# as units, all disabled, needing an engine that was never installed — which is
# why 128 GiB of VRAM sits idle while gatewayd decodes on the CPU at ~1 tok/s.
# Module 72 provisions the engine host-resident (no podman on this box).
#
# DEFAULT OFF. Turning it on downloads several GB of torch/CUDA wheels on the
# first converge. Verified against PyPI before writing the module: vllm 0.26.0
# ships cp38-abi3 wheels and declares requires_python <3.15,>=3.10, and torch
# 2.13.0 publishes cp314 wheels — so the system's Python 3.14 is supported,
# which was NOT obvious and is the thing most likely to have blocked this.
IAC_VLLM_VENV=/opt/sovereign-os/venv/vllm

# The Logic tier's model, fetched by the repo's own scripts/models/pull.sh so the
# bytes that land match the catalog's hf_repo_id.
#
# Nemotron-3-Nano-Omni-30B-A3B-Reasoning-NVFP4, chosen on evidence already in the
# tree: start-logic-engine.sh's header records it measured on THIS card —
# "2026-07-28 on the RTX 5090 with Nemotron-3-Nano-Omni-30B NVFP4: 314.41 tok/s
# decode, TTFT 0.173s". 30B total but ~3B active (MoE), NVFP4 native on Blackwell
# tensor cores, 22.4 GiB on disk, 24 GiB VRAM — inside the 5090's 32 GiB at 0.90
# utilization with room for the 32k KV cache.
#
# For reference, what else fits: OpenThinker-7B (16 GiB) is the safe fallback;
# Qwen2.5-Coder-14B (30 GiB) does NOT fit at 0.90; Qwen3-Coder-32B (65 GiB) and
# gpt-oss-120b (63 GiB) need the PRO 6000 and the oracle tier, not this one.
IAC_VLLM_MODEL_ID=Nemotron-3-Nano-Omni-30B-Reasoning-NVFP4
IAC_VLLM_MODELS_DIR=/mnt/vault/models

# ~22 GiB download on the first converge. Idempotent afterwards: the module
# checks for config.json AND a .safetensors, so an interrupted download is
# retried rather than mistaken for a provisioned model.
IAC_VLLM_FETCH_MODEL=1

# vLLM's share of the card, and the context it reserves KV for. 0.90 is the
# launcher's own default; lower it if anything else must share the GPU.
IAC_VLLM_GPU_UTIL=0.90
IAC_VLLM_MAX_LEN=32768

# Serving is a SEPARATE opt-in from installing. Module 72 refuses to enable a
# unit whose engine cannot import or whose weights are missing, so this is safe
# to leave on: it takes effect only once both are genuinely in place.
IAC_VLLM_ENABLE_UNIT=1

# Attention backend. Default TRITON_ATTN, not vLLM's own FlashInfer default: the
# bundled flashinfer 0.6.14 ships no prebuilt kernels and JIT-compiles via nvcc,
# which is absent — and apt's CUDA 12.4 is too old for Blackwell's sm_120 to fix
# it. Triton is already installed and compiles with its own LLVM. Set to
# FLASHINFER only after installing a CUDA >= 12.8 toolkit.
IAC_VLLM_ATTENTION_BACKEND=TRITON_ATTN

# flashinfer is reachable a second way — its top-k/top-p SAMPLING kernels, which
# vLLM uses independently of the attention backend. Both routes JIT via nvcc.
# 0 selects the PyTorch-native sampler. Set to 1 alongside a CUDA >= 12.8
# toolkit if the fused sampler is ever worth the install.
IAC_VLLM_FLASHINFER_SAMPLER=0

# Reasoning-trace parser. The Nemotron checkpoint emits chain-of-thought then the
# answer; unparsed, callers get the model thinking out loud plus a stray
# </think>. vLLM's registered name for this family is nemotron_v3 (see
# vllm/reasoning/__init__.py). Empty disables the split.
IAC_VLLM_REASONING_PARSER=nemotron_v3

# ── 84 — route sovereign-gatewayd at the GPU tiers ──────────────────────────
# Module 72 serves a 30B on the 5090 at ~268 tok/s while the cockpit and the Code
# Console still reach gatewayd's CPU model at ~1 tok/s. This registers the tier
# as an openai-dialect GPU proxy so generation moves to the card WITHOUT
# bypassing gatewayd's safety spine, durable memory, agentic loop or ledger.
#
# The proxy id and vLLM's --served-model-name are deliberately the SAME string:
# gatewayd's relay forwards the client request verbatim, model field included, so
# any mismatch would 404 upstream.
IAC_GPU_PROXY_ID=gpu-logic
IAC_GPU_TIER_ENDPOINT=127.0.0.1:8082
IAC_GPU_PROXY_DEVICE=logic
IAC_GPU_PROXY_VRAM=32

# Point the reserved "background" alias at the GPU too: deliberation and CoAT
# expansion already use it, and 268 tok/s beats 1 tok/s for every such caller.
IAC_GPU_SET_BACKGROUND=1

# ── 76 — Oracle tier: gpt-oss-120b on the RTX PRO 6000 ─────────────────────
# The 96 GiB card contributed nothing while a 30B ran on the 5090. gpt-oss-120b
# is not a guess: models/catalog.yaml records it promoted to verified-real on
# 2026-07-28 — "weights pulled and served on SAIN-01, bench gate passed" —
# measured on THIS card at 199.76 tok/s decode, TTFT 0.036 s, 918 tok/s
# aggregate under concurrency (vLLM 0.26.0, MXFP4/Marlin). It has run here.
#
# ~63 GiB download on the first converge. Shares module 72's venv; the oracle
# unit already ships host-resident-correct (no podman ExecStop, 600s timeout,
# HOME relocated), so it needs an env file and weights, not drop-in repairs.
IAC_ORACLE_MODEL_ID=gpt-oss-120b
IAC_ORACLE_PORT=8083
IAC_ORACLE_PROXY_ID=gpu-oracle
IAC_ORACLE_PROXY_VRAM=96
IAC_ORACLE_FETCH_MODEL=1
IAC_ORACLE_ENABLE_UNIT=1

# gpt-oss emits chain-of-thought; vllm/reasoning/__init__.py registers its parser
# as openai_gptoss. Unset to leave the trace in the answer.
IAC_ORACLE_REASONING_PARSER=openai_gptoss

# gpt-oss tool-call parser. REQUIRED for agentic clients (OpenClaw sends tools +
# tool_choice:auto every turn); without --enable-auto-tool-choice + this parser,
# vLLM drops gpt-oss's harmony tool calls and returns an empty turn. vLLM
# registers the gpt-oss tool parser under the name "openai"
# (tool_parsers/__init__.py → GptOssToolParser, a stub delegating to HarmonyParser).
IAC_ORACLE_TOOL_PARSER=openai

# Reclaim alternate-runtime weight trees already on disk. The gpt-oss repo pulled
# 178 GiB against a 63 GiB catalog figure: 58 GiB of safetensors plus original/
# (60 GiB, original-layout checkpoint) and metal/ (60 GiB, Apple Metal weights),
# neither loadable by vLLM on CUDA. pull.sh now excludes them on FUTURE fetches
# via SOVEREIGN_OS_PULL_EXCLUDE; this clears what is already here.
#
# Guarded: a tree is removed only when the safetensors index does not reference
# it. Verified for both — index references neither.
IAC_ORACLE_PRUNE_UNUSED=1
IAC_ORACLE_PRUNE_DIRS="original metal"

# ─── module 78: the Router tier on the RTX 4090 eGPU ─────────────────────────
# Two ~2.2 GiB encoders, not a generation model. Both were served and exercised
# on this card before the module was written:
#   bge-m3          cosine 0.7278 for a paraphrase pair vs 0.3273 unrelated
#   bge-reranker    ranked both relevant passages above both irrelevant ones
#   together        3745 MiB of 24564 resident
#
# Cheap enough to fetch and enable by default, unlike the 63 GiB Oracle pull.
IAC_ROUTER_FETCH_MODEL=1
IAC_ROUTER_ENABLE_UNIT=1

# Both repos ship an onnx/ tree roughly as large as the weights, for a runtime
# this box does not use. bge-m3 also carries doc images.
IAC_ROUTER_PULL_EXCLUDE="onnx/*,*.onnx,imgs/*,assets/*"

# Which tier the reserved "background" alias points at. Empty = last registered.
IAC_GPU_BACKGROUND_ID=gpu-oracle

# What the reserved "auto" alias resolves to — the value every caller that
# expresses no preference sends (the console picker's fallback, prompt.py's
# default, any bare API client). Previously it meant the PRIMARY, i.e. the 1.7B
# CPU model at ~1 tok/s, while the GPUs served 268 and 107 tok/s.
#
# gpu-logic rather than gpu-oracle: the 30B on the 5090 is the faster of the two
# (268 vs 107 tok/s) and the better default for interactive work. The 120B stays
# the background/deliberation target where depth matters more than latency.
# A designated-but-unloaded id resolves to null, so "auto" falls back to the
# primary honestly if the tier goes away.
IAC_GPU_DEFAULT_ID=gpu-logic
IAC_GPU_SET_DEFAULT=1
