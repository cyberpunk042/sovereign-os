schema_version: "1.0.0"
orchestration_profile:
  id: qwen-image-flux-dual
  name: Qwen Image + FLUX.2 — Dual GPU Studio
  description: >-
    Qwen Image 2.1 Uncensored BF16 GGUF on RTX 5090 and FLUX.2-dev on RTX PRO 6000.
    Replaces both GPU chat residents while preserving RTX 4090 desktop,
    embeddings and reranking. Candidate only: image runtime integration and
    generation qualification are pending; downloading weights is not readiness.
  intent: custom
  hardware_profile_compat: [sain-01]
  readiness: candidate
  activation_blocked_reason: Image-serving activation is not implemented; do not apply through the chat tier switcher.
  prerequisites:
    - Install and validate ComfyUI with Qwen Image 2.1 GGUF support and a local FLUX.2 Diffusers runtime.
    - Download selected Qwen transformer, text encoder and VAE; verify checksums.
    - Accept FLUX.2-dev repository terms and download the local Diffusers components.
    - Stop Oracle and Logic through an image-aware activation transaction before loading either image model.
    - Qualify peak VRAM, repeated generation, unload and restoration of qwen38-flash-next-256k.
  allocations:
    - agent_id: qwen_image_5090
      tier: image
      role: image
      target_hardware: "cuda:1"
      engine: comfyui
      model: Qwen-Image-2.1-Uncensored-BF16
      port: 8188
      vram_limit_bytes: 30064771072
      active: true
      image_settings: {width: 1024, height: 1024, batch_size: 1, dtype: bfloat16, text_encoder_offload: cpu, seed: 42}
    - agent_id: flux2_6000
      tier: image
      role: image
      target_hardware: "cuda:0"
      engine: diffusers
      model: FLUX.2-dev
      port: 8189
      vram_limit_bytes: 90194313216
      active: true
      image_settings: {width: 1024, height: 1024, batch_size: 1, dtype: bfloat16, text_encoder_offload: cpu, remote_text_encoder: false, steps: 28, guidance_scale: 4, seed: 42}
    - {agent_id: embed_4090, tier: embed, role: embed, target_hardware: "cuda:2", engine: vllm, model: BAAI-bge-m3, port: 8084, vram_limit_bytes: 4294967296, active: true}
    - {agent_id: rerank_4090, tier: rerank, role: rerank, target_hardware: "cuda:2", engine: vllm, model: BAAI-bge-reranker-v2-m3, port: 8085, vram_limit_bytes: 4294967296, active: true}
